<!doctype html>
<html lang="fr" data-theme="dark" data-lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Emplois et stages — CONGLOMERAT</title>
    <meta
      name="description"
      content="Offres d'emploi et de stage publiées par les entreprises camerounaises de l'annuaire : CDI, CDD, stages académiques et professionnels à Yaoundé, Douala et Bafoussam."
    />
    <link rel="canonical" href="https://conglomerat.cm/offres" />
    <meta name="theme-color" content="#0B1310" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CONGLOMERAT" />
    <meta property="og:title" content="Emplois et stages — CONGLOMERAT" />
    <meta property="og:image" content="https://conglomerat.cm/assets/img/og-default.jpg" />
    <link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/pages.css" />
    <script>
      (function () {
        try {
          var choice = localStorage.getItem("cg.theme") || "dark";
          var light = window.matchMedia("(prefers-color-scheme: light)").matches;
          var resolved = choice === "auto" ? (light ? "light" : "dark") : choice;
          var root = document.documentElement;
          root.dataset.theme = resolved;
          root.dataset.themeChoice = choice;
          root.style.colorScheme = resolved;
          if (localStorage.getItem("cg.saver") === "true") root.dataset.saver = "true";
          var lang = localStorage.getItem("cg.lang");
          if (lang === "en" || lang === "fr") root.lang = lang;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>

  <body class="page" data-page="offers" data-demo="true">
    <a class="skip-link" href="#main" data-i18n="a11y.skip">Aller au contenu</a>
    <header class="site-header" id="site-header"></header>

    <main id="main" class="page-main" tabindex="-1">
      <div class="container">
        <nav class="breadcrumb" style="padding-top: 16px" aria-label="Fil d'Ariane">
          <a href="/" data-i18n="nav.home">Accueil</a>
          <span data-icon="chevronRight" data-icon-size="14" aria-hidden="true"></span>
          <span aria-current="page" data-i18n="nav.offers">Emplois</span>
        </nav>

        <div class="section-head" style="margin-top: 20px">
          <div>
            <h1 data-i18n="offers.title">Emplois et stages</h1>
            <p id="offers-count" data-i18n="offers.subtitle">Les offres publiées par les entreprises de l'annuaire.</p>
          </div>
          <button type="button" class="btn btn-secondary sm" data-offer-alert>
            <span data-icon="bell" data-icon-size="16"></span>
            <span data-i18n="offers.alert">Créer une alerte</span>
          </button>
        </div>

        <div class="tabs" role="tablist" style="margin-bottom: 20px">
          <button class="tab" role="tab" data-type="" aria-selected="true" data-i18n="offers.type.all">
            Toutes les offres
          </button>
          <button class="tab" role="tab" data-type="stage" aria-selected="false" data-i18n="offers.type.internship">
            Stages
          </button>
        </div>

        <div class="explorer-toolbar">
          <label class="input-icon" style="flex: 1; min-width: 220px; max-width: 420px">
            <span data-icon="search" data-icon-size="17" aria-hidden="true"></span>
            <input class="input" id="offers-search" type="search" autocomplete="off"
                   placeholder="Intitulé, entreprise, compétence…"
                   aria-label="Rechercher une offre" />
          </label>

          <div class="row" style="gap: 8px; flex-wrap: wrap">
            <select class="select" id="filter-contract" style="width: auto" aria-label="Type de contrat"></select>
            <select class="select" id="filter-city" style="width: auto" aria-label="Ville"></select>
            <select class="select" id="filter-sector" style="width: auto" aria-label="Secteur"></select>
            <select class="select" id="offers-sort" style="width: auto" aria-label="Trier">
              <option value="recentes" data-i18n="explore.sort.recent">Nouvelles</option>
              <option value="deadline" data-i18n="offers.deadline">Date limite</option>
            </select>
          </div>
        </div>

        <div class="stack" id="offers-list" style="gap: 10px"></div>

        <div class="load-more" id="offers-more-wrap" hidden>
          <button type="button" class="btn btn-secondary" id="offers-more">
            <span data-i18n="common.seeMore">Voir plus</span>
          </button>
        </div>

        <section class="section">
          <div class="card pad-lg home-contribute">
            <div>
              <h2 style="font-size: var(--h3)" data-i18n="business.offerNew">Publier une offre</h2>
              <p class="muted" data-i18n="business.subtitle">
                Gérez vos fiches, vos offres et vos réponses aux avis.
              </p>
            </div>
            <a class="btn btn-primary" href="/espace-entreprise">
              <span data-icon="plus" data-icon-size="17"></span>
              <span data-i18n="nav.business">Espace entreprise</span>
            </a>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
    <script type="module" src="/assets/js/core/app.js"></script>
  </body>
</html>
