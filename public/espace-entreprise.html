<!doctype html>
<html lang="fr" data-theme="dark" data-lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Espace entreprise — CONGLOMERAT</title>
    <meta name="description" content="Gérez la fiche de votre entreprise, répondez aux avis et publiez vos offres d'emploi et de stage." />
    <link rel="canonical" href="https://conglomerat.cm/espace-entreprise" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0B1310" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CONGLOMERAT" />
    <meta property="og:title" content="Espace entreprise — CONGLOMERAT" />
    <meta property="og:description" content="Gérez la fiche de votre entreprise, répondez aux avis et publiez vos offres d'emploi et de stage." />
    <meta property="og:image" content="https://conglomerat.cm/assets/img/og-default.jpg" />
    <link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/pages.css" />
    <script>
      (function () {
        try {
          var choice = localStorage.getItem("cg.theme") || "dark";
          var light = window.matchMedia("(prefers-color-scheme: light)").matches;
          var resolved = choice === "auto" ? (light ? "light" : "dark") : choice;
          var root = document.documentElement;
          root.dataset.theme = resolved;
          root.dataset.themeChoice = choice;
          root.style.colorScheme = resolved;
          if (localStorage.getItem("cg.saver") === "true") root.dataset.saver = "true";
          var lang = localStorage.getItem("cg.lang");
          if (lang === "en" || lang === "fr") root.lang = lang;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>

  <body class="page" data-page="business">
    <a class="skip-link" href="#main" data-i18n="a11y.skip">Aller au contenu</a>
    <header class="site-header" id="site-header"></header>

    <main id="main" class="page-main" tabindex="-1">
      <div class="container" id="business-root">
        <div class="section-head" style="padding-top: 24px">
          <div>
            <h1 data-i18n="business.title">Espace entreprise</h1>
            <p data-i18n="business.subtitle">Gérez vos fiches, vos offres et vos réponses aux avis.</p>
          </div>
          <div class="row" style="gap: 8px">
            <a class="btn btn-ghost sm" href="/premium">
              <span data-icon="sparkles" data-icon-size="16"></span>
              <span data-i18n="common.premium">Premium</span>
            </a>
            <button type="button" class="btn btn-primary sm" id="business-new-offer">
              <span data-icon="plus" data-icon-size="16"></span>
              <span data-i18n="business.offerNew">Publier une offre</span>
            </button>
          </div>
        </div>

        <section class="section" style="padding-top: 0">
          <h2 style="font-size: var(--h3); margin-bottom: 14px" data-i18n="business.myCompanies">
            Mes entreprises
          </h2>
          <div class="stack" id="business-companies" style="gap: 14px"></div>
        </section>

        <section class="section" style="padding-top: 0">
          <div class="row-between" style="margin-bottom: 12px">
            <h2 style="font-size: var(--h3)" data-i18n="business.myOffers">Mes offres</h2>
          </div>
          <div id="business-offers"></div>
        </section>

        <div class="grid two">
          <section class="card">
            <h2 style="font-size: var(--text-md); margin-bottom: 10px" data-i18n="business.claims">
              Revendications
            </h2>
            <div class="stack" id="business-claims" style="gap: 8px"></div>
          </section>
          <section class="card">
            <h2 style="font-size: var(--text-md); margin-bottom: 10px" data-i18n="business.payments">
              Paiements
            </h2>
            <div class="stack" id="business-payments" style="gap: 8px"></div>
          </section>
        </div>
      </div>

      <dialog id="company-dialog" aria-labelledby="company-dialog-title">
        <div class="sheet">
          <div class="sheet-handle" aria-hidden="true"></div>
          <div class="sheet-head">
            <h2 id="company-dialog-title" data-i18n="business.editProfile">Modifier la fiche</h2>
            <button type="button" class="icon-btn sm" data-close-dialog aria-label="Fermer"
                    data-icon="x"></button>
          </div>
          <div class="sheet-body" data-dialog-body></div>
        </div>
      </dialog>

      <dialog id="offer-dialog" aria-labelledby="offer-dialog-title">
        <div class="sheet">
          <div class="sheet-handle" aria-hidden="true"></div>
          <div class="sheet-head">
            <h2 id="offer-dialog-title" data-i18n="business.offerNew">Publier une offre</h2>
            <button type="button" class="icon-btn sm" data-close-dialog aria-label="Fermer"
                    data-icon="x"></button>
          </div>
          <div class="sheet-body" data-dialog-body></div>
        </div>
      </dialog>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
    <script type="module" src="/assets/js/core/app.js"></script>
  </body>
</html>
