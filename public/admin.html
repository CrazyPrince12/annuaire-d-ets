<!doctype html>
<html lang="fr" data-theme="dark" data-lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Administration — CONGLOMERAT</title>
    <meta name="description" content="Panneau de modération et de pilotage de l'annuaire." />
    <link rel="canonical" href="https://conglomerat.cm/admin" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0B1310" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CONGLOMERAT" />
    <meta property="og:title" content="Administration — CONGLOMERAT" />
    <meta property="og:description" content="Panneau de modération et de pilotage de l'annuaire." />
    <meta property="og:image" content="https://conglomerat.cm/assets/img/og-default.jpg" />
    <link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/pages.css" />
    <script>
      (function () {
        try {
          var choice = localStorage.getItem("cg.theme") || "dark";
          var light = window.matchMedia("(prefers-color-scheme: light)").matches;
          var resolved = choice === "auto" ? (light ? "light" : "dark") : choice;
          var root = document.documentElement;
          root.dataset.theme = resolved;
          root.dataset.themeChoice = choice;
          root.style.colorScheme = resolved;
          if (localStorage.getItem("cg.saver") === "true") root.dataset.saver = "true";
          var lang = localStorage.getItem("cg.lang");
          if (lang === "en" || lang === "fr") root.lang = lang;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>

  <body class="page" data-page="admin">
    <a class="skip-link" href="#main" data-i18n="a11y.skip">Aller au contenu</a>
    <header class="site-header" id="site-header"></header>

    <main id="main" class="page-main" tabindex="-1">
      <div class="admin-shell">
        <aside class="admin-sidebar">
          <a class="brand" href="/" aria-label="CONGLOMERAT" style="margin-bottom: 8px">
            <img src="/assets/img/logo-mark.svg" alt="" width="30" height="30" />
            <span class="brand-name">CONGLOMERAT</span>
          </a>
          <nav id="admin-nav" aria-label="Sections d'administration"></nav>
          <div style="margin-top: auto; padding-top: 16px" class="stack">
            <p class="faint small" id="admin-user"></p>
            <a class="btn btn-ghost sm" href="/" data-i18n="admin.backToSite">Retour au site</a>
          </div>
        </aside>

        <div class="admin-main" id="admin-root">
          <div class="admin-topbar">
            <div style="flex: 1; min-width: 0">
              <p class="faint small" data-i18n="admin.title">Administration</p>
              <h1 id="admin-title">Tableau de bord</h1>
            </div>
            <label class="input-icon" style="max-width: 280px; flex: 1">
              <span data-icon="search" data-icon-size="16" aria-hidden="true"></span>
              <input class="input" id="admin-search" type="search" data-i18n-placeholder="admin.search"
                     placeholder="Société, e-mail, référence…" aria-label="Rechercher dans l'administration" />
            </label>
          </div>

          <div class="banner warning" id="admin-demo-banner" hidden></div>
          <div id="admin-content"></div>
        </div>
      </div>

      <nav class="admin-mobile-nav" id="admin-mobile-nav" aria-label="Sections"></nav>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
    <script type="module" src="/assets/js/core/app.js"></script>
  </body>
</html>
